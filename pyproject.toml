[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "veloxforce-tools"
version = "0.4.3"
description = "Veloxforce Tools - A toolkit for working with OpenRouter, Langfuse, and Email APIs"
authors = ["Marius Wilsch <marius.santiago.wilsch@gmail.com>"]
readme = "README.md"
license = "MIT"
repository = "https://github.com/MariusWilsch/veloxforce-tools"
packages = [{include = "veloxforce_tools", from = "."}, {include = "veloxforce_tools/py.typed"}]

[tool.poetry.dependencies]
python = ">=3.9,<4.0"
httpx = "*"
pydantic = "*"
tenacity = "*"
rich = "*"
pydantic-settings = "*"
openai = "^1.76.0"
langfuse = "^2.60.3"
imap-tools = "^1.0.0"
python-dotenv = "^1.1.0"

[tool.poetry.group.dev.dependencies]
pytest = "*"
pytest-asyncio = "*"
black = "*"
isort = "*"

[tool.black]
line-length = 88
target-version = ['py39']

[tool.isort]
profile = "black"
line_length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
asyncio_mode = "auto"
